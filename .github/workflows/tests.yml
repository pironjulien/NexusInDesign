# Windows tests and npm audit on every push to main and every pull request (free on a public repository).
# Actions pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push makes the running check pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
