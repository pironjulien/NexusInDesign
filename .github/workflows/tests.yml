# Windows tests (heavy) on demand only; secrets and workflow audit run on every push (security.yml).
# Actions pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Tests

on:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
