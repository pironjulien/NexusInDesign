# Marks retired Nexus servers as deprecated in the official MCP registry (all their versions): NexusInDesign (retired
# 2026-11-27) and NexusAGYmail (retired 2026-11-24, its repository was deleted). Run by hand once. GitHub OIDC login
# (namespace io.github.pironjulien), mcp-publisher pinned by version and SHA-256, no token stored.
name: Registry retire

on:
  workflow_dispatch:

permissions: {}

jobs:
  deprecate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      PUBLISHER_VERSION: v1.8.17
      PUBLISHER_SHA256: 4fbfe8236becd291a7a37b3e2cd7d5a6171ecf25c62a47f4fe92ef9b92007f9b
    steps:
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Deprecate NexusInDesign
        run: ./mcp-publisher status --status deprecated --all-versions -y --message "Retired on 2026-11-27. Adobe's official Adobe for Creativity connector covers InDesign." io.github.pironjulien/nexus-indesign
      - name: Deprecate NexusAGYmail
        run: ./mcp-publisher status --status deprecated --all-versions -y --message "Retired on 2026-11-24. Antigravity now has an official Gmail connector." io.github.pironjulien/nexus-agymail
